    [58, 0, 119, 30], [28, 0, 109, 30], [-28, 1.5, 129, 30], [-58, 3.5, 119, 30],
    [-96, 6.5, 119, 14], [-96, 8, 102, 0],
    [-96, 8, 60, 30], [-110, 9, 34, 30], [-110, 11, 0, 0], [-110, 9, -34, 30], [-96, 8, -60, 30],
    [-96, 8, -102, 0], [-96, 6, -119, 14], [-44, 0, -119, 0],
