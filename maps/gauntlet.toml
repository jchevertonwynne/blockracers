    { from = 104, to = 155, tilt = 0.15 },
    { from = 982, to = 1033, tilt = 0.15 },
]

# A castle's.
walls = { wall = "grey", footing = "dark grey", coping = "grey", cap = "dark grey", battlements = true }

# In the order the road comes to them: one in the middle of a row, on the straight
# between its two bends, and another at one end of it. Whatever stands beside a
# hazard's road has to fit between that row and the next.
hazards = [
    # The temple's stones roll across the road one after another.
    { kind = "stones", at = 55, apart = 22 },
    # The aliens' saucer comes down the road at its lowest.
    { kind = "saucer", at = 242 },
    { kind = "hammer", at = 314 },
    { kind = "cannons", at = 466 },
