# Across the inside of the first western hairpin, through a shed.
byways = [
    { from = 294, to = 414, road = 4, wall = 5.5, bumps = 0, covered = true, taken = 0.3 },
]

pads = [{ at = 20 }, { at = 1716 }]

# Two of the eastern hairpins.
