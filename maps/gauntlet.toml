    [100, 0, -51, 17], [100, 0, -17, 17],
    [58, 0, -17, 30], [28, 0, -27, 30], [-28, 0, -7, 30], [-58, 0, -17, 30],
    [-100, 0, -17, 17], [-100, 0, 17, 17],
    [-58, 0, 17, 30], [-28, 0, 27, 30], [28, 0, 7, 30], [58, 0, 17, 30],
    [100, 0, 17, 17], [100, 0, 51, 17],
    [58, 0, 51, 30], [28, 3.5, 41, 30], [-28, 3.5, 61, 30], [-58, 0, 51, 30],
