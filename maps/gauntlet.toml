# The gauntlet: a road past as many of the game's hazards as can be moved. Eight
# rows, a stretch in each half of a row for a hazard to stand on, with a hairpin
# from each row to the next and a bend or two in the middle of every row but the
# first, so that the next hazard is not seen until it is come to. From the end of
# the last row the road climbs onto a viaduct that winds back over the western
# hairpins to the first. Two of the eastern hairpins are tunnels.
#
# brick.toml says what each thing here is.

name = "Gauntlet"
author = "Brick Racers"

