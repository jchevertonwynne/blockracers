    { at = [-56, -46], half = [5, 4], height = 4, colour = "brown" },
    { at = [56, -46], half = [5, 4], height = 4, colour = "brown" },
    { at = [-56, 46], half = [5, 4], height = 4, colour = "brown" },
    { at = [56, 46], half = [5, 4], height = 4, colour = "brown" },
    { at = [-88, -81], half = [5, 4], height = 4, colour = "brown" },
    { at = [88, -81], half = [5, 4], height = 4, colour = "brown" },
    { at = [-88, 81], half = [5, 4], height = 4, colour = "brown" },
    { at = [88, 81], half = [5, 4], height = 4, colour = "brown" },
]

