# The yard, an arena: a place to fight in, for a battle or a game of tag online,
# with no road. Three ways from one end to the other. The middle one is the short
# one and goes under a bridge; the two outside it are longer, behind buildings,
# and each has a ramp up onto that bridge, which crosses the middle way and looks
# along it both ways. The buildings' roofs are as high as the bridge and joined to
# it by catwalks, with a ramp up to each from its end of the yard, so that there
# is a way round up there too, over the gaps the ways below are crossed by, and
# off any edge of it onto whoever is underneath. The cars start in the open ends,
# three at each.
#
# A map is an arena if it has an `outline`, and a circuit if it has `corners`
# (brick.toml). Everything is in the game's units: x runs east, z south, and a
# height is up. The high ground here is 6 up, which a car under it is clear of.

name = "Brick Yard"
author = "Brick Racers"

# The corners of the floor in order, each [x, z]: a wall stands round it. The floor
# is laid from the middle, [0, 0], out to each side, so every corner is seen from there.
outline = [
    [130, -85],
    [130, 85],
    [-130, 85],
    [-130, -85],
]

# What stands on the floor, solid: its middle `at` [x, z], how far it reaches
# either way from there (`half`), how high, and its colour. Its top is driven on
# where a ramp or a deck comes up to it.
blocks = [
    # The bridge's two piers, either side of the way under it.
    { at = [0, -22], half = [12, 8], height = 6, colour = "yellow" },
    { at = [0, 22], half = [12, 8], height = 6, colour = "yellow" },
    # The buildings between the middle way and the outside ones.
    { at = [-62, -30], half = [22, 8], height = 6, colour = "red" },
    { at = [62, -30], half = [22, 8], height = 6, colour = "blue" },
    { at = [-62, 30], half = [22, 8], height = 6, colour = "red" },
    { at = [62, 30], half = [22, 8], height = 6, colour = "blue" },
    # A chimney on each roof, and a stack of crates in each outside way.
    { at = [-76, -34], half = [3, 3], height = 10, colour = "dark grey" },
    { at = [76, -34], half = [3, 3], height = 10, colour = "dark grey" },
    { at = [-76, 34], half = [3, 3], height = 10, colour = "dark grey" },
    { at = [76, 34], half = [3, 3], height = 10, colour = "dark grey" },
    { at = [-30, -48], half = [3, 3], height = 4, colour = "brown" },
    { at = [30, -48], half = [3, 3], height = 4, colour = "brown" },
    { at = [-30, 48], half = [3, 3], height = 4, colour = "brown" },
    { at = [30, 48], half = [3, 3], height = 4, colour = "brown" },
    # Something to be behind in the middle way, and on the outside ones.
    { at = [-45, 0], half = [4, 6], height = 4, colour = "white" },
    { at = [45, 0], half = [4, 6], height = 4, colour = "white" },
    { at = [-42, -79], half = [4, 4], height = 4, colour = "white" },
    { at = [42, -79], half = [4, 4], height = 4, colour = "white" },
    { at = [-42, 79], half = [4, 4], height = 4, colour = "white" },
    { at = [42, 79], half = [4, 4], height = 4, colour = "white" },
    # And between the ends and the middle way, so that a car starting isn't
    # looking straight down it.
    { at = [-96, 0], half = [3, 9], height = 5, colour = "red" },
    { at = [96, 0], half = [3, 9], height = 5, colour = "blue" },
]

# Slopes from the floor up to `height`, which way each `climbs`.
ramps = [
    { at = [0, -42], half = [12, 12], height = 6, climbs = "south" },
    { at = [0, 42], half = [12, 12], height = 6, climbs = "north" },
    # Up onto each roof from its end of the yard.
    { at = [-96, -30], half = [12, 8], height = 6, climbs = "east" },
    { at = [96, -30], half = [12, 8], height = 6, climbs = "west" },
    { at = [-96, 30], half = [12, 8], height = 6, climbs = "east" },
