# The yard, an arena: a place to fight in, for a battle or a game of tag online,
# with no road. Three ways from one end to the other on the floor, and two more
# over them: the roofs of the buildings between the ways are streets of their
# own, joined to each other by a bridge over the middle way, with a ramp up to
# each roof from its end of the yard and one up to each end of the bridge from the
# way beside it. Whoever is up there is over all three ways and can come down
# off any edge onto any of them; whoever is below gets up by one of six ramps or
# goes under by one of four passages. Everything comes round: nothing ends
# anywhere.
#
# The white bricks, which make whatever a car fires the stronger, are on the
# bridge and nowhere else, where everybody sees who takes them. Under the bridge
# is one of each colour, and the ghost. The red ones, which want a clear line,
# are on the roofs and at the ends of the long ways; the yellow, which are left
# for whoever follows, at the foot of each roof's ramp and in the passages under
# the roofs; the green in the outside ways, to run with; and a shield at each
# end, by the starts.
#
# A map is an arena if it has an `outline`, and a circuit if it has `corners`
# (brick.toml). Everything is in the game's units: x runs east, z south, and a
# height is up. The high ground here is 6 up, which a car under it is clear of.

name = "Brick Yard"
author = "Brick Racers"

# The corners of the floor in order, each [x, z]: a wall stands round it. The floor
# is laid from the middle, [0, 0], out to each side, so every corner is seen from there.
outline = [
    [130, -85],
    [130, 85],
    [-130, 85],
    [-130, -85],
]

# What stands on the floor, solid: its middle `at` [x, z], how far it reaches
# either way from there (`half`), how high, and its colour. Its top is driven on
# where a ramp or a deck comes up to it.
blocks = [
    # The buildings between the middle way and the outside ones, whose roofs
    # are the streets over them.
    { at = [-56, -30], half = [22, 8], height = 6, colour = "red" },
    { at = [56, -30], half = [22, 8], height = 6, colour = "blue" },
    { at = [-56, 30], half = [22, 8], height = 6, colour = "red" },
    { at = [56, 30], half = [22, 8], height = 6, colour = "blue" },
    # The piers at the ends of the bridge, where it meets those streets.
    { at = [0, -30], half = [12, 8], height = 6, colour = "yellow" },
    { at = [0, 30], half = [12, 8], height = 6, colour = "yellow" },
    # A chimney at the outside edge of each roof.
    { at = [-56, -37], half = [3, 1], height = 9, colour = "dark grey" },
    { at = [56, -37], half = [3, 1], height = 9, colour = "dark grey" },
    { at = [-56, 37], half = [3, 1], height = 9, colour = "dark grey" },
    { at = [56, 37], half = [3, 1], height = 9, colour = "dark grey" },
    # Between each end and the middle way, so that a car starting isn't looking
    # straight down it, and something to be behind half way along it.
    { at = [-90, 0], half = [3, 9], height = 5, colour = "red" },
    { at = [90, 0], half = [3, 9], height = 5, colour = "blue" },
    { at = [-42, 0], half = [4, 6], height = 4, colour = "white" },
    { at = [42, 0], half = [4, 6], height = 4, colour = "white" },
    # Crates in the outside ways: against the buildings, and against the wall
