# The ring, an arena: a hill to hold. In the middle of a round floor is a square
# of high ground with a ramp up each of its four sides and the best bricks on
# top; round it are a ring of pillars and the wall's buttresses, to come at it
# from behind, and against the wall north and south a gallery as high as the
# hill, with a ramp up each end of it, that looks across at whoever holds the
# hill.
#
# yard.toml says what each thing here is.

