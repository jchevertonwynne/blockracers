# The ring, an arena: a round floor with a hill in the middle of it and a broken
# wall half way out, which leaves a wide way round the outside to go fast on and
# a court inside. The top of the hill is a roundabout: a ramp comes up onto it
# beside each of its four sides, each onto the right-hand end of its side, so
# that a car coming up is already going round, and comes off whichever edge it
# likes. In the middle of the roundabout the ark turns and fires at whatever is
# near it, which is everything within the roundabout and nothing on it.
#
# The white bricks are round the ark and nowhere else: a car goes in for them
# while the ark's bolt is out, which is not for long, or behind a shield, and
# there is a blue brick at the foot of each ramp. The red ones are on the
# roundabout and on the two humps of the outside way, the yellow and green in
# the gaps of the wall, one in front of each start, and on the outside way
# between the starts. Speed pads lie against the wall.
#
# yard.toml says what each thing here is.

