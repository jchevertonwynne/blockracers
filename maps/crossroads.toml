# The crossroads, an arena: four arms off a junction, and over the junction a
# flyover from the north arm to the south, climbed by a ramp in each, with a deck
# across it from east to west climbed by a ramp from either side: a crossroads
# over the crossroads. East and west go under it, either side of those ramps. The
# east and west arms are each shut twice by walls that leave a way round, with a
# pocket at the end where the best bricks are: two tight turns in and the same
# two out, so a car there is cornered.
#
# yard.toml says what each thing here is.

name = "Crossroads"
author = "Brick Racers"

# The corners of the floor in order, each [x, z]: a wall stands round it. The floor
# is laid from the middle, [0, 0], out to each side, so every corner is seen from there.
outline = [
    [38, -135],
    [38, -38],
    [135, -38],
    [135, 38],
    [38, 38],
    [38, 135],
    [-38, 135],
    [-38, 38],
    [-135, 38],
    [-135, -38],
    [-38, -38],
    [-38, -135],
]

# What stands on the floor, solid: its middle `at` [x, z], how far it reaches
# either way from there (`half`), how high, and its colour. Its top is driven on
# where a ramp or a deck comes up to it.
blocks = [
    # The flyover's piers, where each arm meets the junction.
    { at = [0, -49], half = [8, 11], height = 6, colour = "yellow" },
    { at = [0, 49], half = [8, 11], height = 6, colour = "yellow" },
    # East and west: an island to go either side of, then a gate in the middle.
    { at = [68, 0], half = [3, 16], height = 5, colour = "blue" },
    { at = [100, -25], half = [3, 13], height = 5, colour = "blue" },
    { at = [100, 25], half = [3, 13], height = 5, colour = "blue" },
    { at = [-68, 0], half = [3, 16], height = 5, colour = "red" },
    { at = [-100, -25], half = [3, 13], height = 5, colour = "red" },
    { at = [-100, 25], half = [3, 13], height = 5, colour = "red" },
    # North and south: a wall across the end of each, behind the ramp's foot,
    # and a pillar either side of that.
    { at = [0, -116], half = [14, 3], height = 5, colour = "white" },
    { at = [0, 116], half = [14, 3], height = 5, colour = "white" },
    { at = [-24, -108], half = [4, 4], height = 7, colour = "yellow" },
    { at = [24, -108], half = [4, 4], height = 7, colour = "yellow" },
    { at = [-24, 108], half = [4, 4], height = 7, colour = "yellow" },
    { at = [24, 108], half = [4, 4], height = 7, colour = "yellow" },
]

# Slopes from the floor up to `height`, which way each `climbs`.
ramps = [
    { at = [0, -80], half = [8, 20], height = 6, climbs = "south" },
    { at = [0, 80], half = [8, 20], height = 6, climbs = "north" },
    { at = [-40, 0], half = [10, 6], height = 6, climbs = "east" },
    { at = [40, 0], half = [10, 6], height = 6, climbs = "west" },
]

# Floors held up at `height`, driven on and under.
decks = [
    { at = [0, 0], half = [8, 38], height = 6 },
