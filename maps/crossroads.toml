    { at = [-6, 0], colour = "red", low = true },
    { at = [0, -6], colour = "yellow", low = true },
    { at = [6, 0], colour = "blue", low = true },
    { at = [0, 6], colour = "green", low = true },
    # Red at the head of each ramp, yellow at its foot, and green beside it, on
