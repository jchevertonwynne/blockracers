    { at = [0, -32], colour = "red" },
    { at = [0, 32], colour = "red" },
    { at = [32, 0], colour = "red" },
    { at = [-32, 0], colour = "red" },
    { at = [0, -71], colour = "yellow" },
    { at = [0, 71], colour = "yellow" },
