# The crossroads, an arena: two streets that cross between four blocks, with a
# road round the outside that every street comes out onto, so that there is
# always another way round a block and nothing ends anywhere. Over the crossing
# is a platform with a ramp down into each street: the streets go under it, and
# whoever is on it is over all four and can come off any edge of it into any of
# them. The blocks are too high to see or to shoot over, so a car is in sight
# along the street it is in and no further.
#
# The white bricks are on the platform, where four ramps meet, and nowhere else;
# under it is one of each colour. The red ones are at the ramps' heads, looking
# down the streets, the yellow at their feet for whoever comes after, the green
# beside the ramps and on the road round the outside, and a shield in each
# corner of it. Two cannons stand either side of the west ramp and fire at it as
# a car comes to it.
#
# yard.toml says what each thing here is.

name = "Crossroads"
author = "Brick Racers"

# The corners of the floor in order, each [x, z]: a wall stands round it. The floor
# is laid from the middle, [0, 0], out to each side, so every corner is seen from there.
outline = [
    [108, -108],
    [108, 108],
    [-108, 108],
    [-108, -108],
]

# What stands on the floor, solid: its middle `at` [x, z], how far it reaches
# either way from there (`half`), how high, and its colour. Its top is driven on
# where a ramp or a deck comes up to it.
blocks = [
    # The four blocks between the streets and the road round the outside.
    { at = [-57, -57], half = [27, 27], height = 7, colour = "red" },
    { at = [57, -57], half = [27, 27], height = 7, colour = "blue" },
    { at = [57, 57], half = [27, 27], height = 7, colour = "yellow" },
    { at = [-57, 57], half = [27, 27], height = 7, colour = "green" },
    # The posts the platform stands on.
    { at = [-16, -16], half = [2, 2], height = 5, colour = "dark grey" },
    { at = [16, -16], half = [2, 2], height = 5, colour = "dark grey" },
    { at = [16, 16], half = [2, 2], height = 5, colour = "dark grey" },
    { at = [-16, 16], half = [2, 2], height = 5, colour = "dark grey" },
    # What the two cannons stand on.
    { at = [-59, 15.5], half = [2, 2], height = 4, colour = "brown" },
    { at = [-45, -15.5], half = [2, 2], height = 4, colour = "brown" },
]

# Slopes from the floor up to `height`, which way each `climbs`: one up the
# middle of each street, with a way past it either side.
ramps = [
    { at = [0, -54], half = [8, 12], height = 6, climbs = "south" },
    { at = [0, 54], half = [8, 12], height = 6, climbs = "north" },
    { at = [54, 0], half = [12, 8], height = 6, climbs = "west" },
    { at = [-54, 0], half = [12, 8], height = 6, climbs = "east" },
]

# Floors held up at `height`, driven on and under: the platform, and an arm of it
# out to the head of each ramp.
decks = [
    { at = [0, 0], half = [16, 16], height = 6, colour = "dark grey" },
    { at = [0, -29], half = [8, 13], height = 6 },
    { at = [0, 29], half = [8, 13], height = 6 },
    { at = [29, 0], half = [13, 8], height = 6 },
    { at = [-29, 0], half = [13, 8], height = 6 },
]

