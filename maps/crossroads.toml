rows = 0

# Speed pads on the floor, each at a `place` [x, z] with its arrows pointing
# `heading` degrees round from east to north: against the wall where each street
# comes out, for whoever is going round the outside.
pads = [
    { place = [0, -104], heading = 0 },
    { place = [104, 0], heading = 270 },
    { place = [0, 104], heading = 180 },
    { place = [-104, 0], heading = 90 },
]

# The floor's two colours, which alternate outwards from the middle.
