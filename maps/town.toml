# The town, an arena: a short street with a house at each end, facing each other,
# and a bus and a truck left in the middle of it so that neither house sees the
# other's door. A footbridge runs down the middle of the street from the one
# house's upper floor to the other's, over the bus and the truck: the quick way
# across, in plain sight, with the street to fall into either side. Each house is
# driven through, front to back, and has an upper floor reached by a ramp up
# either side from its back yard, open at the front: a car up there looks down
# the street, and comes off the edge into it. The cars start in the back yards,
# three behind each house, and a path goes round each side of each house for
# whoever would rather not go through it. Small enough that nobody is out of it
# for long.
#
# yard.toml says what each thing here is.

name = "Bricktown"

# The corners of the floor in order, each [x, z]: a wall stands round it. The floor
# is laid from the middle, [0, 0], out to each side, so every corner is seen from there.
outline = [
    [150, -75],
    [150, 75],
    [-150, 75],
    [-150, -75],
]

