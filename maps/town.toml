# The town, an arena: eight houses round a square, a narrow street between each
# two of them from the square out to the road round the outside. The houses'
# roofs are driven on, with a plank from each to the next over the street
# between, so that there is a way right round up there, looking down into the
# square on one side and onto the outside road on the other; a ramp goes up to
# it from each side of the square. So there are three ways round, one inside
# another, the middle one over the other two, and a car is never far from any of
# them: down off any edge, up by the square. Streets and houses hide a car on
# the floor from all but its own street; the roofs see each other and the square.
#
# The white bricks are in the middle of the square and nowhere else, under every
# roof and under the dragon, whose cannonballs fall there, with a yellow one at
# the foot of each ramp out of it. The red ones are on the roofs over the square
# and at the corners of the outside road, a shield on each corner roof, and in
# each street, under its plank, something to leave behind or to get away with.
#
# yard.toml says what each thing here is.

name = "Bricktown"
author = "Brick Racers"

# The corners of the floor in order, each [x, z]: a wall stands round it. The floor
# is laid from the middle, [0, 0], out to each side, so every corner is seen from there.
outline = [
    [100, -100],
    [100, 100],
    [-100, 100],
    [-100, -100],
]

# What stands on the floor, solid: its middle `at` [x, z], how far it reaches
# either way from there (`half`), how high, and its colour. Its top is driven on
# where a ramp or a deck comes up to it.
blocks = [
    # The houses at the corners.
    { at = [-59, -59], half = [18, 18], height = 6, colour = "yellow" },
    { at = [59, -59], half = [18, 18], height = 6, colour = "green" },
    { at = [59, 59], half = [18, 18], height = 6, colour = "blue" },
    { at = [-59, 59], half = [18, 18], height = 6, colour = "orange" },
    # And those between them, one at each side of the square.
    { at = [0, -59], half = [18, 18], height = 6, colour = "red" },
    { at = [59, 0], half = [18, 18], height = 6, colour = "white" },
    { at = [0, 59], half = [18, 18], height = 6, colour = "red" },
    { at = [-59, 0], half = [18, 18], height = 6, colour = "white" },
    # A chimney on the outside corner of each corner house.
    { at = [-72, -72], half = [3, 3], height = 10, colour = "dark grey" },
    { at = [72, -72], half = [3, 3], height = 10, colour = "dark grey" },
    { at = [72, 72], half = [3, 3], height = 10, colour = "dark grey" },
    { at = [-72, 72], half = [3, 3], height = 10, colour = "dark grey" },
    # The bus and two trucks, left in the outside road with a way past either side.
    { at = [-88.5, 0], half = [4, 11], height = 5, colour = "yellow" },
    { at = [-59, -88.5], half = [10, 4], height = 5, colour = "blue" },
    { at = [-59, 88.5], half = [10, 4], height = 5, colour = "blue" },
