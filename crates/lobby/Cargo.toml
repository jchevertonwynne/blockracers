[package]
name = "lobby"
version = "0.1.0"
edition = "2024"

[dependencies]
lobby-api = { path = "../lobby-api" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.4"
# Its logs, traces, metrics and serving, the same as the cluster's other apps
# have theirs, so the dashboard reads it as it reads them. Without jemalloc: the
# lobby has no heap worth profiling, and that leaves no C to build.
homelab = { git = "https://github.com/jchevertonwynne/homelab-rs", tag = "v0.5.0", default-features = false }
tracing = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
