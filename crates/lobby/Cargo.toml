[package]
name = "lobby"
version = "0.1.0"
edition = "2024"

[dependencies]
lobby-api = { path = "../lobby-api" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.4"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
